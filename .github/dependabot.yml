version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # Dev updates must not publish a new library version (see release.config.mjs).
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    ignore:
      # v10 needs conventional-changelog-writer 9; semantic-release 25 ships writer 8.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
