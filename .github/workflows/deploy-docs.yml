name: Deploy demo

# The demo is deployed on its own:
# - when demo files change on main,
# - after a library release (so the demo shows the released version),
# - or manually.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "registry/**" # shadcn registry, built into docs/public/r
      - "registry.json"
      - "vite.config.mts"
      - "README.md" # llms-full.txt is built from it
      - "MIGRATION.md"
  workflow_run:
    workflows: ["Release library"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push to the gh-pages branch

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: ./.github/actions/setup

      - name: Lint & format
        run: pnpm run format

      - name: Build demo
        run: pnpm run build:docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
