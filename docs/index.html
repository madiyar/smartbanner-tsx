<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>smartbanner-tsx — Smart App Banner for React (iOS &amp; Android)</title>
    <meta
      name="description"
      content="Smart App Banner for React 18 and 19. A lightweight, zero-dependency, SSR-safe component that promotes your iOS and Android apps on mobile websites. Theme it with CSS variables or a headless hook."

    <link rel="canonical" href="https://madiyar.github.io/smartbanner-tsx/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="madiyar" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="smartbanner-tsx" />
    <meta property="og:url" content="https://madiyar.github.io/smartbanner-tsx/" />
    <meta property="og:title" content="smartbanner-tsx — Smart App Banner for React" />
    <meta
      property="og:description"
      content="Promote your iOS and Android apps on your mobile website. ~2.5 KB, zero dependencies, SSR-safe, with a live playground."
    />
    <meta property="og:image" content="https://madiyar.github.io/smartbanner-tsx/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="smartbanner-tsx: iOS and Android app banners for React" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="smartbanner-tsx — Smart App Banner for React" />
    <meta
      name="twitter:description"
      content="Promote your iOS and Android apps on your mobile website. ~2.5 KB, zero dependencies, SSR-safe."
    />

    <link rel="alternate" type="text/plain" title="LLM-friendly docs" href="llms.txt" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2023" media="(prefers-color-scheme: dark)" />

    <!-- The banner reads these on real devices (example: YouTube app). -->
    <meta name="apple-itunes-app" content="app-id=544007664" />
    <meta name="google-play-app" content="app-id=com.google.android.youtube" />
    <link rel="apple-touch-icon" href="icon.webp" />
    <link rel="android-touch-icon" href="icon.webp" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var theme = localStorage.getItem("sb-demo-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This demo needs JavaScript.</noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
